name: Build JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        run: mvn --batch-mode package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: built-jar
          path: target/*.jar
          if-no-files-found: error
